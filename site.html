<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
  :root { --brand: #2563EB; --brand-dark: #1D4ED8; --brand-soft: #EAF1FE; --ink: #0B1220; --body: #2B3445; --muted: #5B6478; --line: #DDE2EA; --soft: #F5F7FA; --white: #fff; --good: #0F7A4A; --bad: #B4232A; --font: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color-scheme: light; }
  [hidden] { display: none !important; }
  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; background: var(--white); color: var(--body); font: 400 17px/1.6 var(--font); -webkit-font-smoothing: antialiased; }
  h1, h2, h3, p, ul { margin: 0; padding: 0; }
  h1 { font-size: 46px; line-height: 1.1; font-weight: 800; letter-spacing: -.02em; color: var(--white); text-wrap: balance; }
  h2 { font-size: 36px; line-height: 1.15; font-weight: 800; letter-spacing: -.02em; color: var(--ink); text-wrap: balance; }
  h3 { font-size: 20px; line-height: 1.3; font-weight: 700; color: var(--ink); }
  a { color: var(--brand); }
  :focus-visible { outline: 3px solid rgba(37,99,235,.45); outline-offset: 2px; }
  .in { max-width: 1200px; margin: 0 auto; padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); }
  .preview { background: #FDF1DC; color: #9A5B00; font-size: 14px; font-weight: 600; padding: 8px 0; }
  .preview a { color: inherit; font-weight: 700; }
  .top { background: var(--ink); color: var(--white); font-size: 15px; padding: 8px 0; }
  .top .in { display: flex; justify-content: flex-end; gap: 20px; flex-wrap: wrap; }
  .top b { font-size: 17px; font-weight: 700; }
  .top a { color: inherit; text-decoration: none; }
  header { border-bottom: 1px solid var(--line); background: var(--white); }
  header .in { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-block: 10px; flex-wrap: wrap; }
  .logos { display: flex; align-items: center; gap: 16px; }
  .logos img { display: block; height: 68px; width: auto; max-width: 200px; object-fit: contain; }
  .logos span { font-size: 13px; color: var(--muted); font-weight: 600; max-width: 110px; line-height: 1.25; }
  .tag { font-weight: 700; color: var(--ink); }
  .lang { font-size: 14px; font-weight: 600; margin-left: 14px; }
  .hero { background: linear-gradient(135deg, #0B1F52 0%, #1D4ED8 62%, #2563EB 100%); padding-block: 48px; }
  .hero-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: 48px; align-items: start; }
  .hero-copy { color: #DCE6FB; display: flex; flex-direction: column; gap: 18px; padding-top: 12px; }
  .hero-copy .sub { font-size: 21px; font-weight: 700; color: var(--white); }
  .hero-copy ul { list-style: none; display: flex; flex-direction: column; gap: 8px; border-left: 4px solid #7FA6F5; padding-left: 16px; }
  .hero-copy li { color: var(--white); font-weight: 500; }
  .call { color: var(--white); font-weight: 700; }
  .call a { color: inherit; }
  .form { background: var(--white); border-radius: 18px; padding: 26px; box-shadow: 0 18px 50px rgba(11,18,32,.28); display: flex; flex-direction: column; gap: 14px; min-width: 0; }
  .form h2 { font-size: 26px; }
  .form > p { color: var(--muted); font-size: 16px; }
  .fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  .f { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .f.full { grid-column: 1 / -1; }
  .f label { font-size: 14px; font-weight: 600; color: var(--ink); }
  .f label i { color: var(--bad); font-style: normal; }
  .f input, .f select, .f textarea { width: 100%; height: 52px; padding: 0 12px; border: 1px solid var(--line); border-radius: 10px; font: inherit; font-size: 16px; color: var(--ink); background: var(--white); }
  .f textarea { height: 90px; padding: 10px 12px; }
  .f input:focus, .f select:focus, .f textarea:focus { border-color: var(--brand); outline: 3px solid rgba(37,99,235,.18); }
  .f .e { display: none; color: var(--bad); font-size: 13.5px; font-weight: 600; }
  .f.bad input, .f.bad select { border-color: var(--bad); }
  .f.bad .e { display: block; }
  .tick { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; line-height: 1.45; cursor: pointer; }
  .tick input { width: 20px; height: 20px; flex: none; margin: 1px 0 0; accent-color: var(--brand); }
  .btn { display: inline-flex; align-items: center; justify-content: center; min-height: 60px; padding: 0 28px; border: 0; border-radius: 12px; background: var(--brand); color: var(--white); font: inherit; font-size: 18px; font-weight: 800; cursor: pointer; text-decoration: none; }
  .btn:hover { background: var(--brand-dark); }
  .btn.ghost { background: var(--white); color: var(--brand-dark); }
  .done { text-align: center; padding: 32px 8px; display: flex; flex-direction: column; gap: 10px; align-items: center; }
  .done svg { width: 56px; height: 56px; color: var(--good); }
  section.band { padding-block: 64px; }
  section.soft { background: var(--soft); }
  .center { text-align: center; max-width: 780px; margin: 0 auto 36px; display: flex; flex-direction: column; gap: 12px; }
  .cards { display: grid; gap: 20px; }
  .c4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .c3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .card { background: var(--white); border: 1px solid var(--line); border-radius: 14px; padding: 24px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .card .ic { width: 44px; height: 44px; border-radius: 12px; background: var(--brand-soft); color: var(--brand); display: grid; place-items: center; font-weight: 800; font-size: 18px; }
  .step .ic { background: var(--brand); color: var(--white); border-radius: 50%; }
  .cta { background: var(--ink); color: #C9D3E6; }
  .cta h2 { color: var(--white); }
  .cta .in { display: flex; flex-direction: column; align-items: center; gap: 18px; text-align: center; }
  footer { background: #060B18; color: #9AA6BC; font-size: 14px; padding-block: 28px; }
  footer .in { display: flex; flex-direction: column; gap: 8px; }
  footer a { color: #C9D3E6; }
  .wide { max-width: 860px; margin: 0 auto; }
  .sect { display: flex; flex-direction: column; gap: 12px; }
  .sect + .sect { margin-top: 12px; }
  .sect h3 { border-bottom: 1px solid var(--line); padding-bottom: 8px; }
  .note { font-size: 14px; color: var(--muted); }
  @media (max-width: 960px) { .hero-grid { grid-template-columns: minmax(0, 1fr); gap: 28px; } .c4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } h1 { font-size: 38px; } }
  @media (max-width: 620px) { .c4, .c3, .fields { grid-template-columns: minmax(0, 1fr); } h1 { font-size: 34px; } h2 { font-size: 28px; } section.band { padding-block: 44px; } .form { padding: 20px; } .logos img { height: 54px; } .tag { display: none; } .in { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); } }
  @media print { .preview, .top, .btn, .lang, .cta, .tag { display: none !important; } .hero { background: none; padding: 0; } .form { box-shadow: none; padding: 0; } h1 { color: var(--ink); } .f input, .f select, .f textarea { height: 36px; } }
</style>
</head>

      + '<section class="band soft"><div class="in"><div class="center"><h2>' + esc(T.readyH) + '</h2><p>' + esc(T.readyP) + '</p></div>' + cards(T.ready, 'c3', false, true) + '</div></section>'
      + '<section class="band"><div class="in"><div class="center"><h2>' + esc(T.stepsH) + '</h2></div>' + cards(T.steps, 'c3', true) + '</div></section>'
      + '<section class="band soft"><div class="in"><p class="note" style="text-align:center;font-size:15px">' + esc(T.feeNote) + '</p></div></section><section class="band cta"><div class="in"><h2>' + esc(T.ctaH) + '</h2><a class="btn" href="#lead-form">' + esc(T.ctaB) + '</a></div></section>');
  }
  function partnerPage() {
    return shell(T.partnerTag, '<section class="hero"><div class="in hero-grid"><div class="hero-copy"><h1>' + esc(T.partnerH1) + '</h1><p class="sub">' + esc(T.partnerSub) + '</p><ul>' + T.perks.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul></div>'
      + '<form class="form" id="lead-form" data-kind="partner" novalidate><h2>' + esc(T.pFormT) + '</h2><p>' + esc(T.pFormS) + '</p><div class="fields">'
      + inp('first', T.first) + inp('last', T.last) + inp('phone', T.mobile, 'tel') + inp('email', T.email, 'email') + inp('company', T.company) + inp('title', T.title) + sel('state', T.state, US_STATES) + inp('bizPhone', T.bizPhone, 'tel', '', false) + sel('industry', T.industry, INDUSTRIES, 'full') + inp('password', T.password, 'password', 'full')
      + '</div>' + hp() + consent() + '<button class="btn">' + esc(T.join) + '</button><p class="note" style="text-align:center">' + esc(T.haveAcct) + ' <a href="index.html">' + esc(T.logIn) + '</a></p></form></div></section>'
      + '<section class="band"><div class="in"><div class="center"><h2>' + esc(T.howH) + '</h2><p>' + esc(T.howS) + '</p></div>' + cards(T.how, 'c3', true) + '</div></section>'
      + '<section class="band cta"><div class="in"><h2>' + esc(T.qH) + '</h2><p>' + esc(T.qP) + '</p><a class="btn" href="tel:' + esc(phone.replace(/[^0-9+]/g, '')) + '">' + esc(T.qB) + ': ' + esc(phone) + '</a></div></section>');
  }
  function applyPage() {
    return shell(T.bizTag, '<section class="band soft"><div class="in wide"><form class="form" id="lead-form" data-kind="apply" novalidate><h2>' + esc(T.appT) + '</h2><p>' + esc(T.appS) + '</p>'
      + '<div class="sect"><h3>' + esc(T.secBiz) + '</h3><div class="fields">' + inp('company', T.legal) + inp('dba', T.dba, 'text', '', false) + inp('address', T.address, 'text', 'full') + inp('city', T.city) + sel('state', T.state, US_STATES) + inp('zip', T.zip) + inp('entity', T.entity) + inp('start', T.start, 'date') + sel('industry', T.industry, INDUSTRIES) + inp('phone', T.bizPhone, 'tel') + inp('website', T.web, 'text', '', false) + '</div></div>'
      + '<div class="sect"><h3>' + esc(T.secOwner) + '</h3><div class="fields">' + inp('first', T.first) + inp('last', T.last) + inp('email', T.email, 'email') + inp('mobile', T.mobile, 'tel') + inp('pct', T.ownerPct) + sel('score', T.score, SCORES) + '</div></div>'
      + '<div class="sect"><h3>' + esc(T.secFund) + '</h3><div class="fields">' + inp('amount', T.amount) + sel('product', T.product, PRODUCTS.map(function (p) { return p.name; })) + inp('monthly', T.monthly) + sel('sales', T.sales, SALES) + sel('tib', T.tib, TIB) + '<div class="f full"><label for="use">' + esc(T.use) + '</label><textarea id="use" name="use"></textarea></div></div></div>'
      + '<p class="note">' + esc(T.feeNote) + ' ' + esc(T.secure) + '</p>' + hp() + consent() + '<button class="btn">' + esc(T.submitApp) + '</button><button type="button" class="btn ghost" id="print" style="border:1px solid var(--line)">' + esc(T.print) + '</button></form></div></section>');
  }
  function start() {
  phone = cfg.customPhone || cfg.phone || TBF_PHONE; email = cfg.email || TBF_EMAIL;
  document.getElementById('app').innerHTML = page === 'partner' ? partnerPage() : page === 'apply' ? applyPage() : bizPage();
  document.title = (page === 'partner' ? T.partnerH1 : page === 'apply' ? T.appT : T.bizH1) + ' | The Business Funders';
  if (cfg.favicon) { var ic = document.createElement('link'); ic.rel = 'icon'; ic.href = cfg.favicon; document.head.appendChild(ic); }

  /* Ad and analytics tags the partner saved in their website settings. IDs are checked so nothing else can be injected. */
  function addTags(t) {
    if (!t) return;
    function script(src, inline) { var s = document.createElement('script'); if (src) { s.async = true; s.src = src; } else s.text = inline; document.head.appendChild(s); }
    if (/^(G|UA|AW)-[A-Z0-9-]+$/i.test(t.ga)) { script('https://www.googletagmanager.com/gtag/js?id=' + t.ga); script('', "window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments)}gtag('js',new Date());gtag('config','" + t.ga + "');"); }
    if (/^[0-9]{5,20}$/.test(t.fb)) script('', "!function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,document,'script','https://connect.facebook.net/en_US/fbevents.js');fbq('init','" + t.fb + "');fbq('track','PageView');");
    if (/^[0-9]{5,20}$/.test(t.uet)) script('', "(function(w,d,t,r,u){var f,n,i;w[u]=w[u]||[],f=function(){var o={ti:'" + t.uet + "'};o.q=w[u],w[u]=new UET(o),w[u].push('pageLoad')},n=d.createElement(t),n.src=r,n.async=1,n.onload=n.onreadystatechange=function(){var s=this.readyState;s&&s!=='loaded'&&s!=='complete'||(f(),n.onload=n.onreadystatechange=null)},i=d.getElementsByTagName(t)[0],i.parentNode.insertBefore(n,i)})(window,document,'script','https://bat.bing.com/bat.js','uetq');");
    if (/^https:\/\/[^\s"'<>]+$/.test(t.pixel)) { var im = new Image(1, 1); im.src = t.pixel; }
  }
  addTags(cfg.tracking && cfg.tracking[page === 'partner' ? 'partner' : 'biz']);

  var pr = document.getElementById('print'); if (pr) pr.addEventListener('click', function () { document.getElementById('lead-form').reset(); window.print(); });
  var form = document.getElementById('lead-form');
  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var ok = true, first = null;
    form.querySelectorAll('[required]').forEach(function (el) {
      var bad = el.type === 'checkbox' ? !el.checked : !el.value.trim() || (el.type === 'email' && !/^\S+@\S+\.\S+$/.test(el.value.trim()));
      var box = el.closest('.f'); if (box) box.classList.toggle('bad', bad);
      if (bad) { ok = false; first = first || el; }
    });
    if (!ok) { first.focus(); return; }
    var d = {}; new FormData(form).forEach(function (v, k) { d[k] = v; });
    var kind = form.getAttribute('data-kind');
    if (kind === 'apply') d.note = ['Full application.', d.dba && 'DBA: ' + d.dba, 'Address: ' + d.address + ', ' + d.city + ', ' + d.state + ' ' + d.zip, 'Type: ' + d.entity, 'Started: ' + d.start, 'Owner share: ' + d.pct + '%', 'Requested: ' + d.amount, 'Monthly sales: ' + d.monthly, d.use && 'Use: ' + d.use].filter(Boolean).join(' ');
    else if (kind === 'biz') d.note = 'State: ' + d.state + '. Has website: ' + d.web + '. Mobile: ' + d.mobile + '.';
    if (kind === 'partner' && d.password.length < 10) { var pb = form.querySelector('[data-f="password"]'); pb.classList.add('bad'); pb.querySelector('.e').textContent = T.tooShort; form.password.focus(); return; }
    d.consent = true; if (d.bizPhone && !d.mobile) d.mobile = d.bizPhone;
    var btn = form.querySelector('button:not([type=button])'), label = btn.textContent; btn.disabled = true; btn.textContent = T.sending;
    function failed(err) { btn.disabled = false; btn.textContent = label; var p = form.querySelector('.send-err') || form.appendChild(Object.assign(document.createElement('p'), { className: 'send-err', style: 'color:var(--bad);font-weight:600' })); p.textContent = err && err.status && err.status < 500 ? err.message : T.errSend; }
    if (kind === 'partner') {
      var pw = d.password;
      submitLead('signup', ref, d).then(function () {
        var sb = supabase.createClient(SB_URL, SB_KEY);
        return sb.auth.signInWithPassword({ email: d.email.trim().toLowerCase(), password: pw }).then(function (r) { if (r.error) throw r.error; location.href = 'index.html#home'; });
      }).catch(failed);
      return;
    }
    submitLead('deal', ref, d).then(function () {
      form.innerHTML = '<div class="done"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M8 12l3 3 5-6"/></svg><h2>' + esc(T.doneT) + '</h2><p>' + esc(T.doneS) + '</p><p><b>' + esc(phone) + '</b></p></div>';
    }, failed);
  });
  }
  if (ref) {
    fetch(SB_URL + '/rest/v1/rpc/public_site', { method: 'POST', headers: { 'Content-Type': 'application/json', apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY }, body: JSON.stringify({ p_code: ref }) })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (j) { if (j) { prof = { company: j.company }; ['logo', 'favicon', 'phone', 'customPhone', 'email'].forEach(function (k) { if (j[k]) cfg[k] = j[k]; }); if (j.tracking) cfg.tracking = j.tracking; } }, function () {})
      .then(start);
  } else start();
})();
</script>
</body>
