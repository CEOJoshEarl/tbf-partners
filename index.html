<!doctype html>
<html lang="en">
<meta charset="utf-8">
<link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png">
<link rel="icon" type="image/png" sizes="512x512" href="img/favicon-512.png">
<link rel="apple-touch-icon" href="img/favicon-180.png">
<title>Business Funders Partner Portal</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
  /* Layout: white rail on the left, soft canvas on the right, one primary action per page. Single light theme to match thebusinessfunders.com. */
  :root {
    --brand: #2563EB; --brand-dark: #1D4ED8; --brand-soft: #EAF1FE;
    --ink: #0B1220; --body: #2B3445; --muted: #5B6478; --line: #DDE2EA; --soft: #F5F7FA; --white: #FFFFFF;
    --good: #0F7A4A; --good-soft: #E3F5EC; --warn: #9A5B00; --warn-soft: #FDF1DC; --bad: #B4232A; --bad-soft: #FCE8E8;
    --radius: 14px; --shadow: 0 1px 2px rgba(11,18,32,.06), 0 10px 28px rgba(11,18,32,.07);
    --font: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color-scheme: light;
  }
  [hidden] { display: none !important; }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--soft); color: var(--body); font: 400 16px/1.55 var(--font); -webkit-font-smoothing: antialiased; }
  table, input, select, textarea, button { font: inherit; color: inherit; }
  h1, h2, h3, h4, p { margin: 0; }
  h1 { font-size: 34px; line-height: 1.15; font-weight: 800; letter-spacing: -.02em; color: var(--ink); text-wrap: balance; }
  h2 { font-size: 20px; line-height: 1.25; font-weight: 700; letter-spacing: -.01em; color: var(--ink); }
  h3 { font-size: 17px; line-height: 1.3; font-weight: 700; color: var(--ink); }
  a { color: var(--brand); }
  :focus-visible { outline: 3px solid rgba(37,99,235,.45); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

  .app { display: grid; grid-template-columns: 272px minmax(0, 1fr); min-height: 100%; }
  .rail { position: sticky; top: 0; height: 100vh; background: var(--white); border-right: 1px solid var(--line); display: flex; flex-direction: column; padding: 20px 16px; gap: 20px; overflow-y: auto; }
  .rail .logo img { display: block; width: 158px; height: auto; margin: 0 8px; }
  .nav { display: flex; flex-direction: column; gap: 4px; }
  .nav a { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 10px; font-weight: 600; color: var(--body); text-decoration: none; }
  .nav a:hover { background: var(--soft); }
  .nav a.on { background: var(--brand-soft); color: var(--brand-dark); }
  .nav svg, .tabs svg { width: 20px; height: 20px; flex: none; }
  .rail-foot { margin-top: auto; display: flex; flex-direction: column; gap: 12px; }
  .help { font-size: 13px; overflow-wrap: anywhere; color: var(--muted); padding: 14px; background: var(--soft); border-radius: 10px; }
  .help strong { display: block; color: var(--ink); font-size: 16px; }
  .switch { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 14px; font-weight: 600; padding: 4px 6px; cursor: pointer; }
  .switch input { width: 40px; height: 22px; appearance: none; background: var(--line); border-radius: 22px; position: relative; cursor: pointer; transition: background .15s; flex: none; margin: 0; }
  .switch input::after { content: ""; position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 50%; background: var(--white); transition: left .15s; }
  .switch input:checked { background: var(--brand); }
  .switch input:checked::after { left: 20px; }

  main { min-width: 0; padding-block: 28px 64px; padding-left: max(32px, env(safe-area-inset-left, 0px)); padding-right: max(32px, env(safe-area-inset-right, 0px)); }
  .wrap { max-width: 1240px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px; }
  .head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px; }
  .head p { color: var(--muted); margin-top: 6px; font-size: 17px; max-width: 62ch; }
  .sample { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; background: var(--warn-soft); color: var(--warn); border-radius: 10px; padding: 10px 14px; font-size: 14px; font-weight: 600; }
  .sample button { background: none; border: 0; padding: 0; color: inherit; font-weight: 700; text-decoration: underline; cursor: pointer; }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 20px; border-radius: 10px; border: 1px solid var(--line); background: var(--white); color: var(--ink); font-weight: 700; cursor: pointer; text-decoration: none; transition: background .12s, border-color .12s; }
  .btn:hover { border-color: #B8C2D2; background: var(--soft); }
  .btn.primary { background: var(--brand); border-color: var(--brand); color: var(--white); }
  .btn.primary:hover { background: var(--brand-dark); border-color: var(--brand-dark); }
  .btn.small { min-height: 38px; padding: 0 12px; font-size: 14px; }
  .btn svg { width: 18px; height: 18px; }

  .card { background: var(--white); border: 1px solid var(--line); border-radius: var(--radius); padding: 22px; min-width: 0; }
  .grid { display: grid; gap: 20px; }
  .kpis { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .home-cols { grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); align-items: start; }
  .stack { display: flex; flex-direction: column; gap: 20px; min-width: 0; }
  .kpi span { display: block; font-size: 14px; font-weight: 600; color: var(--muted); }
  .kpi strong { display: block; margin-top: 8px; font-size: 34px; line-height: 1.1; font-weight: 800; letter-spacing: -.02em; color: var(--ink); font-variant-numeric: tabular-nums; }
  .kpi.lead { background: var(--brand); border-color: var(--brand); }
  .kpi.lead span, .kpi.lead strong { color: var(--white); }
  .seg { display: inline-flex; flex-wrap: wrap; background: var(--white); border: 1px solid var(--line); border-radius: 10px; padding: 3px; gap: 2px; }
  .seg button { border: 0; background: none; padding: 8px 14px; border-radius: 8px; font-size: 14px; font-weight: 600; color: var(--muted); cursor: pointer; }
  .seg button.on { background: var(--brand-soft); color: var(--brand-dark); }
  .card-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }

  .stage-row { display: grid; grid-template-columns: 124px minmax(0, 1fr) 32px; align-items: center; gap: 12px; padding: 7px 0; width: 100%; background: none; border: 0; text-align: left; cursor: pointer; font-weight: 600; font-size: 15px; }
  .stage-row:hover .bar i { background: var(--brand-dark); }
  .bar { display: block; height: 10px; background: var(--soft); border-radius: 6px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--brand); border-radius: 6px; min-width: 2px; }
  .stage-row em { font-style: normal; text-align: right; color: var(--ink); font-variant-numeric: tabular-nums; }

  .chart { position: relative; }
  .chart svg { display: block; width: 100%; height: auto; }
  .chart text { fill: var(--muted); font-size: 13px; font-family: var(--font); }
  .chart .b { fill: var(--brand); }
  .chart .hit { fill: transparent; cursor: default; }
  .chart .hit:hover + .b, .chart g:hover .b { fill: var(--brand-dark); }
  .tip { position: absolute; pointer-events: none; background: var(--ink); color: var(--white); font-size: 13px; font-weight: 600; padding: 6px 10px; border-radius: 8px; transform: translate(-50%, -110%); white-space: nowrap; }

  .attn { display: flex; flex-direction: column; }
  .attn button { display: flex; gap: 12px; align-items: flex-start; text-align: left; background: none; border: 0; border-top: 1px solid var(--line); padding: 12px 0; cursor: pointer; width: 100%; }
  .attn button:first-child { border-top: 0; padding-top: 0; }
  .attn b { display: block; color: var(--ink); font-weight: 700; }
  .attn small { color: var(--muted); font-size: 14px; display: block; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #E08A00; margin-top: 7px; flex: none; }
  .link-row { display: flex; flex-direction: column; gap: 6px; padding: 12px 0; border-top: 1px solid var(--line); }
  .link-row:first-of-type { border-top: 0; padding-top: 0; }
  .link-row label { font-size: 14px; font-weight: 700; color: var(--ink); }
  .link-row div { display: flex; gap: 8px; }
  .link-row input { flex: 1; min-width: 0; height: 40px; padding: 0 10px; font-size: 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--soft); color: var(--body); }

  .tools { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
  .search { flex: 1 1 280px; position: relative; min-width: 0; }
  .search svg { position: absolute; left: 14px; top: 15px; width: 18px; height: 18px; color: var(--muted); }
  .search input { width: 100%; height: 48px; padding: 0 14px 0 42px; border: 1px solid var(--line); border-radius: 10px; background: var(--white); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { border: 1px solid var(--line); background: var(--white); border-radius: 999px; padding: 7px 14px; font-size: 14px; font-weight: 600; cursor: pointer; color: var(--body); }
  .chip b { color: var(--muted); font-weight: 600; margin-left: 4px; font-variant-numeric: tabular-nums; }
  .chip.on { background: var(--ink); border-color: var(--ink); color: var(--white); }
  .chip.on b { color: #B9C3D3; }

  .tbl { overflow-x: auto; background: var(--white); border: 1px solid var(--line); border-radius: var(--radius); }
  table { border-collapse: collapse; width: 100%; font-size: 15px; }
  th { text-align: left; font-size: 13px; font-weight: 700; color: var(--muted); padding: 12px 16px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th button { all: unset; cursor: pointer; }
  th button:focus-visible { outline: 3px solid rgba(37,99,235,.45); }
  td { padding: 14px 16px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  tr:last-child td { border-bottom: 0; }
  tbody tr { cursor: pointer; }
  tbody tr:hover { background: var(--soft); }
  td .main { display: block; font-weight: 700; color: var(--ink); }
  td .sub { display: block; font-size: 14px; color: var(--muted); }
  .num { text-align: right; font-variant-numeric: tabular-nums; }
  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-size: 13px; font-weight: 700; background: var(--brand-soft); color: var(--brand-dark); white-space: nowrap; }
  .pill.good { background: var(--good-soft); color: var(--good); }
  .pill.bad { background: var(--bad-soft); color: var(--bad); }
  .pill.warn { background: var(--warn-soft); color: var(--warn); }
  .pill.plain { background: var(--soft); color: var(--muted); }
  .empty { padding: 40px 20px; text-align: center; color: var(--muted); }
  .empty h3 { margin-bottom: 6px; }

  .board { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(230px, 1fr); gap: 14px; overflow-x: auto; padding-bottom: 8px; }
  .col { background: #EBEFF5; border-radius: var(--radius); padding: 12px; display: flex; flex-direction: column; gap: 10px; min-height: 180px; }
  .col h3 { display: flex; justify-content: space-between; font-size: 15px; padding: 2px 4px; }
  .col h3 span { color: var(--muted); font-weight: 600; }
  .tile { background: var(--white); border: 1px solid var(--line); border-radius: 10px; padding: 12px; cursor: pointer; text-align: left; width: 100%; display: flex; flex-direction: column; gap: 4px; }
  .tile:hover { border-color: var(--brand); }
  .tile b { color: var(--ink); line-height: 1.3; }
  .tile small { color: var(--muted); font-size: 13.5px; }

  dialog { border: 0; padding: 0; color: var(--body); background: var(--white); }
  dialog::backdrop { background: rgba(11,18,32,.5); }
  #modal { width: min(760px, calc(100vw - 32px)); max-height: calc(100vh - 48px); border-radius: 18px; box-shadow: var(--shadow); }
  #drawer { width: min(600px, 100vw); height: 100vh; max-height: 100vh; margin: 0 0 0 auto; border-left: 1px solid var(--line); }
  .dlg-head { position: sticky; top: 0; z-index: 2; background: var(--white); display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; padding: 22px 24px 16px; border-bottom: 1px solid var(--line); }
  .dlg-head h2 { font-size: 24px; font-weight: 800; }
  .dlg-head p { color: var(--muted); font-size: 15px; margin-top: 2px; }
  .x { width: 40px; height: 40px; flex: none; border: 1px solid var(--line); border-radius: 10px; background: var(--white); cursor: pointer; font-size: 20px; line-height: 1; color: var(--ink); }
  .dlg-body { padding: 20px 24px 28px; display: flex; flex-direction: column; gap: 22px; }
  .dlg-foot { position: sticky; bottom: 0; background: var(--white); border-top: 1px solid var(--line); padding: 14px 24px; display: flex; justify-content: flex-end; gap: 10px; flex-wrap: wrap; }

  .round-box { border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 8px; background: var(--white); }
  .app-row { display: flex; justify-content: space-between; gap: 12px; text-align: left; width: 100%; background: var(--soft); border: 0; border-radius: 10px; padding: 10px 12px; cursor: pointer; font: inherit; color: var(--body); }
  .app-row:hover { background: var(--brand-soft); }
  .app-row small { display: block; color: var(--muted); font-size: 13px; }
  .app-right { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; flex: none; }
  .round-fee { display: flex; align-items: center; justify-content: flex-end; flex-wrap: wrap; gap: 10px; font-size: 14px; }
  #fund-box:empty { display: none; }
  .form-sec { display: flex; flex-direction: column; gap: 12px; }
  .form-sec > h3 { font-size: 16px; }
  .fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
  .field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
  .field.full { grid-column: 1 / -1; }
  .field label { font-size: 14px; font-weight: 600; color: var(--ink); }
  .field .req { color: var(--bad); }
  .field input, .field select, .field textarea { width: 100%; height: 50px; padding: 0 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--white); }
  .field textarea { height: 96px; padding: 10px 12px; resize: vertical; }
  .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--brand); outline: 3px solid rgba(37,99,235,.18); }
  .field .err { display: none; font-size: 13.5px; color: var(--bad); font-weight: 600; }
  .field.bad input, .field.bad select { border-color: var(--bad); }
  .field.bad .err { display: block; }
  .field .hint { font-size: 13.5px; color: var(--muted); }
  .note-warn { font-size: 14px; font-weight: 600; color: var(--warn); background: var(--warn-soft); border-radius: 10px; padding: 10px 12px; }
  .tick { display: flex; gap: 10px; align-items: flex-start; font-size: 15px; cursor: pointer; }
  .tick input { width: 20px; height: 20px; margin: 2px 0 0; accent-color: var(--brand); flex: none; }
  details > summary { cursor: pointer; font-weight: 700; color: var(--ink); }

  .track { display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 4px; }
  .track i { height: 8px; border-radius: 4px; background: var(--line); display: block; }
  .track i.done { background: var(--brand); }
  .track.won i.done { background: var(--good); }
  .track-label { display: flex; justify-content: space-between; gap: 12px; font-size: 14px; color: var(--muted); margin-top: 8px; }
  .track-label b { color: var(--ink); }
  .kv { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 20px; }
  .kv div { min-width: 0; }
  .kv span { display: block; font-size: 13px; font-weight: 600; color: var(--muted); }
  .kv b { display: block; font-weight: 600; color: var(--ink); overflow-wrap: anywhere; }
  .todo { display: flex; flex-direction: column; gap: 8px; }
  .note { border-top: 1px solid var(--line); padding-top: 10px; font-size: 15px; }
  .note small { display: block; font-size: 13px; color: var(--muted); }
  .team { background: var(--soft); border: 1px dashed #B8C2D2; border-radius: var(--radius); padding: 16px; display: flex; flex-direction: column; gap: 12px; }

  .cards-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .tile-link { display: flex; flex-direction: column; gap: 8px; text-decoration: none; color: inherit; }
  a.tile-link:hover, button.tile-link:hover { border-color: var(--brand); }
  button.tile-link { text-align: left; cursor: pointer; font: inherit; }
  .tile-link p { font-size: 15px; color: var(--muted); }
  .prod { display: flex; flex-direction: column; gap: 8px; }
  .prod p { font-size: 15px; }
  .prod .mins { font-size: 14px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 8px; margin-top: auto; }
  details.lesson { background: var(--white); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px 22px; }
  details.lesson summary { font-size: 18px; }
  details.lesson[open] summary { margin-bottom: 10px; }
  details.lesson ul, details.lesson ol { margin: 8px 0 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; }
  .tpl { white-space: pre-wrap; background: var(--soft); border-radius: 10px; padding: 14px; font-size: 15px; }
  .tbd { display: inline-block; font-size: 12px; font-weight: 700; letter-spacing: .04em; color: var(--warn); background: var(--warn-soft); border-radius: 6px; padding: 2px 8px; }
  .result { display: flex; flex-direction: column; gap: 10px; }
  .result li { list-style: none; }
  .toast { position: fixed; left: 50%; bottom: calc(92px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--white); padding: 12px 18px; border-radius: 10px; font-weight: 600; z-index: 50; box-shadow: var(--shadow); max-width: calc(100vw - 32px); }
  .flyers { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .flyer { display: flex; flex-direction: column; gap: 8px; background: none; border: 0; padding: 0; text-align: left; font-weight: 600; font-size: 15px; color: var(--ink); cursor: pointer; }
  .flyer img { width: 100%; aspect-ratio: 4 / 5; display: block; background: var(--white); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); }
  .flyer:hover img { border-color: var(--brand); }
  .lesson-body { display: flex; flex-direction: column; gap: 10px; }
  .lesson-body ol, .lesson-body ul { margin: 0; }
  .topbar, .tabs { display: none; }
  .login-wrap { min-height: 100vh; display: grid; place-items: center; padding-block: 24px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .login-card { width: min(440px, 100%); background: var(--white); border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow); padding: 32px; display: flex; flex-direction: column; gap: 16px; }
  .login-card img { width: 170px; height: auto; }
  .login-err { color: var(--bad); font-weight: 600; font-size: 15px; }
  .link-btn { background: none; border: 0; padding: 0; color: var(--brand); font-weight: 600; cursor: pointer; text-align: left; }

  @media (max-width: 1160px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } .home-cols { grid-template-columns: minmax(0, 1fr); } .cards-3 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 1160px) { .flyers { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  @media (max-width: 820px) {
    .flyers { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .app { grid-template-columns: minmax(0, 1fr); }
    .rail { display: none; }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--white); border-bottom: 1px solid var(--line); padding-block: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
    .topbar img { display: block; height: 44px; width: auto; }
    .tabs { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; background: var(--white); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
    .tabs a { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 9px 2px 8px; font-size: 12px; font-weight: 600; color: var(--muted); text-decoration: none; }
    .tabs a.on { color: var(--brand); }
    main { padding-block: 20px 104px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
    h1 { font-size: 30px; }
    .kpi strong { font-size: 28px; }
    .head .btn.primary { width: 100%; }
    .head [data-act="add-lead"] { display: none; }
    .cards-3, .fields, .kv { grid-template-columns: minmax(0, 1fr); }
    .kv { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .tbl { background: none; border: 0; overflow: visible; }
    .tbl thead { display: none; }
    .tbl table, .tbl tbody { display: block; }
    .tbl tr { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; background: var(--white); border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin-bottom: 10px; }
    .tbl td { display: block; padding: 0; border: 0; min-width: 0; }
    .tbl td.hide-sm { display: none; }
    .tbl td.num { text-align: right; }
    #modal { width: 100vw; max-width: 100vw; max-height: 100vh; height: 100vh; margin: 0; border-radius: 0; }

    if (f.reset && f.reset.checked) { rec.client_decision = null; rec.decided_at = null; }
    /* Fees are due before the next round starts. */
    var owed = fundingSummary(dealApps(d), dealPays(d), d.feePct).rounds.filter(function (r) { return r.round < rec.round && r.fee > 0 && !r.paid; })[0];
    if (!was && owed && !window.confirm('The ' + money(owed.fee) + ' fee for round ' + owed.round + ' has not been marked paid. It is due before round ' + rec.round + ' begins. Add this application anyway?')) return;
    var newOffer = rec.status === 'approved' && (!was || was.status !== 'approved');
    function done() { return reloadFunding().then(function () { $('#modal').close(); renderDeal(d); toast('Saved'); if (LIVE && newOffer) token().then(function (t) { return clientApi({ action: 'notify_offer', deal: d.id }, t); }).catch(function () {}); }); }
    if (!LIVE) { if (was) Object.assign(was, rec); else state.apps.push(Object.assign({ id: nextId(state.apps), client_decision: null }, rec)); return done(); }
    (was ? sb.from('deal_applications').update(rec).eq('id', was.id) : sb.from('deal_applications').insert(rec)).then(function (r) { if (r.error) return fail('That did not save. Please try again.'); return done(); });
  }

    { title: 'Start here', lessons: [

      L('m1v2', 'Traditional and alternative lending', '<p>Traditional lenders are banks and credit unions. They usually offer lower rates but want strong credit, a long history and plenty of paperwork, and they can take a while.</p><p>Alternative lenders are mostly private companies. They look more at revenue and cash flow, ask for less paperwork and move faster. That speed and flexibility often costs more.</p>'),

      L('m1v4', 'What alternative lending includes', '<ul><li>Working capital and merchant cash advances</li><li>Short-term loans and lines of credit</li><li>Equipment financing</li><li>Invoice factoring</li><li>Purchase order and inventory financing</li></ul>'),

      + '<div class="field"><label for="a-email">Email</label><input id="a-email" type="email" name="email" value="' + esc(p.email) + '"></div><div class="field"><label for="a-phone">Phone</label><input id="a-phone" type="tel" name="phone" value="' + esc(p.phone) + '"></div>'
      + '<div class="field full"><label for="a-company">Company</label><input id="a-company" name="company" value="' + esc(p.company) + '"></div>'
      + '</div><button class="btn primary" style="align-self:flex-start">Save changes</button></form>'
      + '<div class="stack"><section class="card"><div class="card-head"><h2>Your links</h2><span class="pill plain">Code ' + esc(p.code) + '</span></div>' + linkRow('Send business owners here', L.biz, 'al-biz') + linkRow('Invite other partners here', L.partner, 'al-partner') + '</section>'
      + '<section class="card form-sec"><h2>How you get paid</h2><p>You earn <b>20%</b> of the fee we collect on each client you refer who gets funded. Fund 10 or more clients in a month and you earn <b>40%</b> the next month. Each month sets the rate for the month after it.</p><p>You also earn <b>2.5%</b> on funded deals from partners you bring in.</p><p>We usually collect a success fee from the client after funding. Sometimes a lender partner pays us instead, and we will tell you when that happens.</p><p><a href="' + SITE + '/terms-of-use" target="_blank" rel="noopener">Terms of use</a> · <a href="' + SITE + '/privacy-policy" target="_blank" rel="noopener">Privacy policy</a></p></section>'
      + (LIVE ? '<section class="card form-sec"><h2>Your login</h2><p>' + esc(p.email) + '</p><button class="btn small" style="align-self:flex-start" data-act="logout">Log out</button>' + (isTeamUser ? '<label class="switch" style="padding:0"><span>Team view</span><input type="checkbox" data-act="team"' + (state.team ? ' checked' : '') + '></label>' : '') + '</section></div></div>' : '<section class="card form-sec"><h2>Preview tools</h2><label class="switch" style="padding:0"><span>Team view</span><input type="checkbox" data-act="team"' + (state.team ? ' checked' : '') + '></label><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn small" data-act="restore-sample">Load sample data</button><button class="btn small" data-act="clear-sample">Start empty</button></div></section></div></div>');
  }
  var PAGES = { home: homePage, deals: dealsPage, partners: partnersPage, website: websitePage, training: trainingPage, resources: resourcesPage, collateral: collateralPage, emails: emailsPage, social: socialPage, guide: guidePage, qualifier: qualifierPage, account: accountPage };

  /* ---------- Events ---------- */
  document.addEventListener('click', function (e) {
    var dlg = e.target; if ((dlg.id === 'modal' || dlg.id === 'drawer') && dlg.open) { var r = dlg.getBoundingClientRect(); if (e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom) dlg.close(); return; }
    var el = e.target.closest('[data-act]'); if (!el) return;
    var act = el.getAttribute('data-act'), v = el.getAttribute('data-v'), id = el.getAttribute('data-id');
    if (act === 'add-lead') openLead();
    else if (act === 'add-partner') openPartnerForm();
    else if (act === 'close-modal') $('#modal').close();
    else if (act === 'close-drawer') $('#drawer').close();
    else if (act === 'open-deal') openDeal(id);
    else if (act === 'open-partner') openPartner(+id);
    else if (act === 'copy') copy(v);
    else if (act === 'app-add') openApp(currentDeal());
    else if (act === 'app-edit') openApp(currentDeal(), (state.apps || []).filter(function (a) { return String(a.id) === id; })[0]);
    else if (act === 'app-delete') { if (window.confirm('Delete this application?')) { var dd = currentDeal(); if (!LIVE) { state.apps = state.apps.filter(function (a) { return String(a.id) !== id; }); reloadFunding().then(function () { $('#modal').close(); renderDeal(dd); }); } else sb.from('deal_applications').delete().eq('id', id).then(function () { return reloadFunding(); }).then(function () { $('#modal').close(); renderDeal(dd); }); } }
    else if (act === 'round-pay') setRoundPaid(currentDeal(), +v, +id);
    else if (act === 'round-unpay') setRoundPaid(currentDeal(), +v, null);
    else if (act === 'package-done') { try { localStorage.setItem('tbf-package-done', '1'); } catch (e) {} rerenderKeep(); }
    else if (act === 'period') { ui.period = v; rerenderKeep(); }
    else if (act === 'goto-group') { ui.dealGroup = v; ui.dealView = 'list'; location.hash = '#deals'; }
    else if (act === 'group') { ui.dealGroup = v; rerenderKeep(); }
    else if (act === 'view') { ui.dealView = v; rerenderKeep(); }
    else if (act === 'sort') { if (ui.dealSort === v) ui.dealDir *= -1; else { ui.dealSort = v; ui.dealDir = v === 'company' || v === 'product' ? 1 : -1; } rerenderKeep(); }
    else if (act === 'copy-list') copy(['Business\tContact\tEmail\tPhone\tProduct\tStage\tSent\tFunded\tCommission'].concat(dealRows().map(function (d) { return [d.company, d.first + ' ' + d.last, d.email, d.phone, d.product, STAGES[d.stage], date(d.created), d.fundedAmt, d.commission].join('\t'); })).join('\n'), 'List copied. Paste it into a spreadsheet.');
    else if (act === 'team') { state.team = el.checked; save(); render(); toast(state.team ? 'Team view on. Open a deal to see the controls.' : 'Team view off'); }
    else if (act === 'clear-sample') { var t = state.team; state = emptyState(); state.team = t; save(); render(); toast('Started empty'); }
    else if (act === 'restore-sample') { state = sampleState(); save(); render(); toast('Sample data loaded'); }
    else if (act === 'qualify-to-lead') qualifierToLead();
    else if (act === 'flyer-brand') { ui.flyerBrand = v; rerenderKeep(); }
    else if (act === 'flyer-lang') { ui.flyerLang = v; rerenderKeep(); }
    else if (act === 'email-brand') { ui.emailBrand = v; rerenderKeep(); }
    else if (act === 'open-flyer') openFlyer(v);
    else if (act === 'remove-upload') { state.site[v] = ''; save(); push(function () { return sb.from('partners').update({ site: state.site }).eq('id', userId); }); rerenderKeep(); toast('Removed'); }
    else if (act === 'sign-partner') { state.partners.forEach(function (p) { if (p.id === +id) p.status = 'Signed'; }); save(); openPartner(+id); rerenderKeep(); }
    else if (act === 'logout') { sb.auth.signOut().then(function () { location.reload(); }); }
    else if (act === 'forgot') { var em = $('#l-email').value.trim(); if (!em) { showLoginErr('Enter your email first, then click this again.'); return; } sb.auth.resetPasswordForEmail(em, { redirectTo: location.origin + location.pathname }).then(function () { showLoginErr('If that email has an account, a reset link is on its way.'); }); }
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Enter' && e.target.matches && e.target.matches('tr[data-act]')) e.target.click(); });
  document.addEventListener('input', function (e) {
    var k = e.target.getAttribute('data-input');
    if (k) { ui[k] = e.target.value; rerenderKeep(); return; }
    if (e.target.name === 'email' && e.target.id === 'f-email' && $('#dupe')) {
      var val = e.target.value.trim().toLowerCase(), hit = state.deals.filter(function (d) { return d.email.toLowerCase() === val; })[0], box = $('#dupe');
      box.hidden = !hit; if (hit) box.textContent = 'You already sent a lead with this email: ' + hit.company + ' (' + STAGES[hit.stage] + ').';
    }
  });
  document.addEventListener('change', function (e) {
    var d;
    if (e.target.hasAttribute('data-lesson')) { var lid = e.target.getAttribute('data-lesson'), openIds = [].map.call(document.querySelectorAll('details.lesson[open] input[data-lesson]'), function (x) { return x.getAttribute('data-lesson'); }); state.done = state.done.filter(function (x) { return x !== lid; }); if (e.target.checked) state.done.push(lid); save(); push(function () { return sb.from('partners').update({ done: state.done }).eq('id', userId); }); rerenderKeep(); openIds.forEach(function (o) { var n = document.querySelector('input[data-lesson="' + o + '"]'); if (n) n.closest('details').open = true; }); return; }
    if (e.target.hasAttribute('data-upload')) { var which = e.target.getAttribute('data-upload'), file = e.target.files[0]; if (!file) return; var rd = new FileReader(); rd.onload = function () { var im = new Image(); im.onload = function () { var max = which === 'logo' ? 480 : 96, r = Math.min(1, max / Math.max(im.width, im.height)), cv = document.createElement('canvas'); cv.width = Math.round(im.width * r); cv.height = Math.round(im.height * r); cv.getContext('2d').drawImage(im, 0, 0, cv.width, cv.height); state.site[which] = cv.toDataURL('image/png'); save(); push(function () { return sb.from('partners').update({ site: state.site }).eq('id', userId); }); rerenderKeep(); toast('Saved'); }; im.onerror = function () { toast('That file is not an image we can read'); }; im.src = rd.result; }; rd.readAsDataURL(file); return; }
    if (e.target.hasAttribute('data-item')) { d = currentDeal(); var ix = +e.target.getAttribute('data-item'), ck = e.target.checked; d.items[ix].done = ck; save(); push(function () { return sb.rpc('set_deal_item', { p_deal: d.id, p_index: ix, p_done: ck }); }); renderDeal(d); rerenderKeep(); }
    var fk = e.target.getAttribute('data-fund');
    if (fk) {
      d = currentDeal(); var fv = fk === 'fee_pct' ? (+String(e.target.value).replace(/[^0-9.]/g, '') || 0) : e.target.value;
      if (fk === 'fee_pct') d.feePct = fv; else d.clientNote = fv;
      save(); var upd = {}; upd[fk] = fv; push(function () { return sb.from('deals').update(upd).eq('id', d.id); }); if (fk === 'fee_pct') renderDeal(d); return;
    }
    var k = e.target.getAttribute('data-deal');
    if (k) {
      d = currentDeal();
      if (k === 'stage') { d.stage = +e.target.value; if (d.stage === 10 && !d.fundedDate) d.fundedDate = new Date().toISOString(); }
      else if (k === 'lossReason') d.lossReason = e.target.value;
      else d[k] = +String(e.target.value).replace(/[^0-9.]/g, '') || 0;
      save(); push(function () { return sb.from('deals').update({ stage: d.stage, loss_reason: d.lossReason, funded_amt: d.fundedAmt, funded_date: d.fundedDate || null, commission: d.commission }).eq('id', d.id); }); renderDeal(d); rerenderKeep();
    }
  });
  document.addEventListener('submit', function (e) {
    e.preventDefault();
    var f = e.target, kind = f.getAttribute('data-form'), d;
    if (kind === 'app') { saveApp(f); return; }
    if (kind === 'login') { sb.auth.signInWithPassword({ email: f.email.value.trim().toLowerCase(), password: f.password.value }).then(function (r) { if (r.error) { showLoginErr('That email and password do not match.'); return; } return enter(); }).catch(function () { showLoginErr('We could not log you in. Please call us.'); }); return; }
    if (kind === 'newpass') { if (f.password.value.length < 10) { showLoginErr('Please use at least 10 characters.'); return; } sb.auth.updateUser({ password: f.password.value }).then(function (r) { if (r.error) { showLoginErr('That did not save. Please try the link again.'); return; } return enter(); }); return; }
    if (kind === 'lead') {
      if (!validLead(f)) return;
      d = { id: nextId(state.deals), created: new Date().toISOString(), first: f.first.value.trim(), last: f.last.value.trim(), email: f.email.value.trim(), phone: f.phone.value.trim(), company: f.company.value.trim(), score: f.score.value, industry: f.industry.value.trim(), tib: f.tib.value, sales: f.sales.value, product: f.product.value, partnerId: f.partnerId.value.trim(), refId: f.refId.value.trim(), stage: 1, lossReason: '', items: [], notes: [], fundedAmt: 0, fundedDate: '', commission: 0, via: '' };
      if (f.note.value.trim()) d.notes.push({ at: d.created, by: 'You', text: f.note.value.trim() });
      if (LIVE) {
        var sbtn = f.querySelector('.dlg-foot .primary'); sbtn.disabled = true; sbtn.textContent = 'Sending...';
        token().then(function (t) { return submitLead('deal', state.profile.code, { first: d.first, last: d.last, email: d.email, phone: d.phone, company: d.company, score: d.score, industry: d.industry, tib: d.tib, sales: d.sales, product: d.product, partnerId: d.partnerId, refId: d.refId, note: d.notes[0] ? d.notes[0].text : '' }, t); })
          .then(function (r) { var nd = mapDeal(r.deal); state.deals.unshift(nd); $('#modal').close(); render(); toast('Lead sent'); openDeal(nd.id); }, function (err) { sbtn.disabled = false; sbtn.textContent = 'Send lead'; toast(err.message); });
        return;
      }
      state.deals.push(d); save(); $('#modal').close(); render(); toast('Lead sent'); openDeal(d.id);
    } else if (kind === 'partner') {
      var ok = true;
      ['first', 'last', 'email', 'phone'].forEach(function (n) { var bad = !f[n].value.trim(); f.querySelector('[data-f="' + n + '"]').classList.toggle('bad', bad); if (bad) ok = false; });
      if (!ok) return;
      state.partners.push({ id: nextId(state.partners), created: new Date().toISOString(), first: f.first.value.trim(), last: f.last.value.trim(), email: f.email.value.trim(), phone: f.phone.value.trim(), company: f.company.value.trim(), status: 'Invited', notes: f.note.value.trim() });
      var np = state.partners[state.partners.length - 1]; save(); $('#modal').close(); render(); toast('Partner added');
      if (LIVE) token().then(function (t) { return submitLead('invite', state.profile.code, { first: np.first, last: np.last, email: np.email, phone: np.phone, company: np.company, note: np.notes }, t); }).catch(function (err) { toast(err.message); });
    } else if (kind === 'add-note') {
      d = currentDeal(); var text = f.text.value.trim(); if (!text) return;
      d.notes.push({ at: new Date().toISOString(), by: state.team ? 'The Business Funders' : 'You', text: text }); save(); push(function () { return sb.rpc('add_deal_note', { p_deal: d.id, p_text: text }); }); renderDeal(d);
    } else if (kind === 'add-item') {
      d = currentDeal(); var item = f.text.value.trim(); if (!item) return;
      d.items.push({ text: item, done: false }); save(); push(function () { return sb.from('deals').update({ items: d.items }).eq('id', d.id); }); renderDeal(d); rerenderKeep();
    } else if (kind === 'qualifier') {
      if (!f.reportValidity()) return;
      ui.qualifier = { monthly: +String(f.monthly.value).replace(/[^0-9.]/g, '') || 0, years: +f.years.value || 0, score: +f.score.value || 0, model: f.model.value, ownsEquip: f.ownsEquip.value, wantsEquip: f.wantsEquip.value };
      rerenderKeep();
    } else if (kind === 'news') {
      var nt = f.text.value.trim(); if (!nt) return; state.news.push({ at: new Date().toISOString(), text: nt }); save(); push(function () { return sb.from('news').insert({ text: nt }); }); rerenderKeep(); toast('Posted');
    } else if (kind === 'site') {
      ['phone', 'customPhone', 'email'].forEach(function (n) { state.site[n] = f['s-' + n].value.trim(); });
      ['biz', 'partner'].forEach(function (k) { ['pixel', 'ga', 'uet', 'fb'].forEach(function (n) { state.site.tracking[k][n] = f['t-' + k + '-' + n].value.trim(); }); });
      save(); push(function () { return sb.from('partners').update({ site: state.site }).eq('id', userId); }); toast('Saved');
    } else if (kind === 'profile') {
      ['first', 'last', 'email', 'phone', 'company'].forEach(function (n) { state.profile[n] = f[n].value.trim(); });
      save(); push(function () { var q = state.profile; return sb.from('partners').update({ first: q.first, last: q.last, phone: q.phone, company: q.company }).eq('id', userId); }); toast('Saved');
    }
  });
  window.addEventListener('hashchange', render);
  if (!LIVE) render();
  else {
    var recovering = /type=recovery/.test(location.hash);
    if (recovering) showLogin('', 'recovery');
    else sb.auth.getSession().then(function (r) { if (r.data.session) return enter(); showLogin(); }).catch(function () { showLogin(); });
    sb.auth.onAuthStateChange(function (ev) { if (ev === 'PASSWORD_RECOVERY') showLogin('', 'recovery'); });
  }
})();
</script>
