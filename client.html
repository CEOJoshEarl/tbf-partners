<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png">
<link rel="icon" type="image/png" sizes="512x512" href="img/favicon-512.png">
<link rel="apple-touch-icon" href="img/favicon-180.png">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Your Funding | The Business Funders</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
  :root { --brand: #2563EB; --brand-dark: #1D4ED8; --brand-soft: #EAF1FE; --ink: #0B1220; --body: #2B3445; --muted: #5B6478; --line: #DDE2EA; --soft: #F5F7FA; --white: #FFFFFF; --good: #0F7A4A; --good-soft: #E3F5EC; --bad: #B4232A; --bad-soft: #FCE8E8; --warn: #9A5B00; --warn-soft: #FDF1DC; }
  [hidden] { display: none !important; }
  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; background: var(--soft); color: var(--body); font: 400 17px/1.5 Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
  h1, h2, h3 { color: var(--ink); margin: 0; letter-spacing: -0.02em; line-height: 1.15; }
  h1 { font-size: 30px; font-weight: 800; } h2 { font-size: 21px; font-weight: 700; } p { margin: 0; }
  button, input { font: inherit; }
  .top { background: var(--white); border-bottom: 1px solid var(--line); padding: 12px 16px; }
  .top > div { max-width: 860px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .top img { height: 46px; width: auto; display: block; }
  main { max-width: 860px; margin: 0 auto; padding: 24px 16px 60px; display: flex; flex-direction: column; gap: 18px; }
  .card { background: var(--white); border: 1px solid var(--line); border-radius: 16px; padding: 22px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
  .hero { background: var(--brand); border-color: var(--brand); color: #fff; }
  .hero h1, .hero h2 { color: #fff; }
  .hero .big { font-size: 46px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.05; }
  .hero small { font-size: 15px; opacity: .92; }
  .btn { display: inline-flex; align-items: center; justify-content: center; min-height: 48px; padding: 0 20px; border-radius: 10px; border: 1px solid var(--line); background: var(--white); color: var(--ink); font-weight: 600; cursor: pointer; }
  .btn:disabled { opacity: .6; cursor: default; }
  .btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
  .btn.primary:hover { background: var(--brand-dark); }
  .btn.small { min-height: 38px; padding: 0 14px; font-size: 15px; }
  .btn:focus-visible, input:focus-visible, .link:focus-visible { outline: 3px solid #1a5fd0; outline-offset: 2px; }
  .link { background: none; border: 0; padding: 0; color: var(--brand); font-weight: 600; cursor: pointer; text-decoration: underline; }
  .pill { display: inline-flex; align-items: center; padding: 3px 10px; border-radius: 999px; font-size: 13px; font-weight: 700; background: var(--brand-soft); color: var(--brand-dark); white-space: nowrap; }
  .pill.good { background: var(--good-soft); color: var(--good); } .pill.bad { background: var(--bad-soft); color: var(--bad); } .pill.warn { background: var(--warn-soft); color: var(--warn); }
  .auth { max-width: 440px; margin: 40px auto; }
  .auth img { height: 64px; width: auto; align-self: flex-start; }
  .field { display: flex; flex-direction: column; gap: 5px; }
  .field label { font-size: 14px; font-weight: 600; color: var(--ink); }
  .field input { height: 50px; padding: 0 12px; border: 1px solid var(--line); border-radius: 10px; background: #fff; width: 100%; }
  .field textarea { padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: #fff; width: 100%; font: inherit; resize: vertical; }
  #msg-form { display: flex; flex-direction: column; gap: 10px; }
  .err { color: var(--bad); font-weight: 600; font-size: 15px; } .ok { color: var(--good); font-weight: 600; font-size: 15px; }
  .muted { color: var(--muted); font-size: 15px; }
  .track { display: grid; grid-template-columns: repeat(10, 1fr); gap: 4px; }
  .track i { height: 8px; border-radius: 4px; background: var(--line); } .track i.done { background: var(--brand); }
  .track-label { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; font-size: 15px; } .track-label b { color: var(--ink); }
  .tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
  .tile { background: var(--soft); border-radius: 12px; padding: 12px; } .tile span { display: block; font-size: 13px; color: var(--muted); } .tile b { font-size: 26px; font-weight: 800; color: var(--ink); }
  .offer { border: 2px solid var(--brand); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .offer .amt { font-size: 28px; font-weight: 800; color: var(--ink); letter-spacing: -0.02em; }
  .row { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); }
  .row small { display: block; color: var(--muted); font-size: 14px; }
  .row .right { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; flex: none; }
  .row .right b { color: var(--ink); }
  .head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .fee { background: var(--soft); border-radius: 12px; padding: 12px 14px; display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; font-size: 15px; }
  .acts { display: flex; gap: 8px; flex-wrap: wrap; }
  @media (max-width: 480px) { h1 { font-size: 25px; } .hero .big { font-size: 38px; } .tile b { font-size: 22px; } }
  .roles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; background: var(--soft); border-radius: 10px; padding: 4px; }
  .roles a { text-align: center; padding: 9px 4px; border-radius: 8px; font-weight: 600; font-size: 15px; color: var(--muted); text-decoration: none; }
  .roles a:hover { color: var(--ink); }
  .roles a.on { background: var(--white); color: var(--brand-dark); box-shadow: 0 1px 2px rgba(11,18,32,.12); }
  .hero { background: linear-gradient(135deg, #1D4ED8, #2563EB 60%, #3B82F6); color: #fff; border-radius: 18px; padding: 26px; }
  .hero .big { font-size: 52px; font-weight: 800; letter-spacing: -.03em; line-height: 1.1; margin: 4px 0; }
  .hero small { font-size: 16px; opacity: .92; display: block; }
  .next { border-left: 5px solid var(--brand); } .next.warn { border-left-color: #D98A00; } .next.good { border-left-color: var(--good); }
  .eyebrow { font-size: 13px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
  .team-note { background: var(--soft); border-radius: 10px; padding: 10px 12px; font-size: 16px; } .team-note b { color: var(--ink); }
  .stack { display: flex; flex-direction: column; gap: 10px; } .sect { padding: 6px 2px 0; }
  .steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
  .steps li { display: flex; align-items: center; gap: 12px; color: var(--muted); } .steps i { font-style: normal; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-size: 14px; font-weight: 700; background: var(--soft); flex: none; }
  .steps li.done { color: var(--body); } .steps li.done i { background: var(--good-soft); color: var(--good); } .steps li.now { color: var(--ink); font-weight: 700; } .steps li.now i { background: var(--brand); color: #fff; }
  .round { background: var(--white); border: 1px solid var(--line); border-radius: 16px; padding: 0 18px; } .round summary { display: flex; justify-content: space-between; gap: 12px; padding: 16px 0; cursor: pointer; font-size: 17px; list-style: none; } .round summary::-webkit-details-marker { display: none; } .round summary b { color: var(--ink); } .round summary::after { content: ''; width: 8px; height: 8px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: rotate(45deg); align-self: center; margin: -3px 3px 0 4px; flex: none; } .round[open] summary::after { transform: rotate(-135deg); margin-top: 3px; } .round summary span { margin-left: auto; color: var(--ink); font-weight: 600; }
  .grp { margin: 14px 0 2px; font-size: 13px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); } .grp span { font-weight: 600; text-transform: none; letter-spacing: 0; }
  .round .row b { color: var(--ink); } .round .fee { margin-bottom: 16px; } .round .fee b { color: var(--ink); }
  .offer { background: var(--white); } .offer .head b { color: var(--ink); }
  .pill.mute { background: var(--soft); color: var(--muted); }
  body { background: #F7F8FB; } .top img { height: 42px; }
  main { max-width: 680px; }
  .terms { background: var(--soft); border-radius: 8px; padding: 12px; }
  .terms-label { display: block; font-size: 13px; font-weight: 700; color: var(--ink); margin-bottom: 4px; }
  .terms p { margin: 0; font-size: 15px; line-height: 1.5; color: var(--ink); white-space: pre-line; overflow-wrap: anywhere; }
  .terms p.muted { color: var(--muted); }
  .view-terms { margin-top: 4px; font-size: 14px; }
  .view-terms summary { display: inline-block; padding: 0; color: var(--brand); cursor: pointer; font-weight: 400; }
  .view-terms summary::after { content: none; display: none; }
  .view-terms p { margin: 6px 0 0; white-space: pre-line; overflow-wrap: anywhere; color: var(--ink); }
  @media (max-width: 480px) { .acts .btn { flex: 1; } .hero .big { font-size: 42px; } }
</style>
</head>
<body>
<header class="top" id="top" hidden><div><img data-logo alt="The Business Funders"><button class="btn small" id="logout">Log out</button></div></header>
<main id="app" aria-live="polite"></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="shared.js"></script>
<script>
(function () {
  var sb = supabase.createClient(SB_URL, SB_KEY, { auth: { storageKey: 'tbf-client-auth' } }), app = document.getElementById('app'), last = '';
  var PHONE = '1-888-994-4548', BUREAU = { EX: 'Experian', EQ: 'Equifax', TU: 'TransUnion' };
  function esc(v) { return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function money(n) { return '$' + Math.round(n || 0).toLocaleString('en-US'); }
  function logos() { document.querySelectorAll('img[data-logo]').forEach(function (i) { i.src = LOGO; }); }

  function showLogin(msg) {
    document.getElementById('top').hidden = true; last = '';
    app.innerHTML = '<form class="card auth" id="login"><img data-logo alt="The Business Funders">' + roleChooser('client') + '<h1>Client login</h1><p class="muted">See what stage we are in, every lender we applied to, and decide on your offers.</p>'
      + '<div class="field"><label for="e">Email</label><input id="e" name="email" type="email" autocomplete="username" required></div>'
      + '<div class="field"><label for="p">Password</label><input id="p" name="password" type="password" autocomplete="current-password" required></div>'
      + '<p class="err" id="msg"' + (msg ? '' : ' hidden') + '>' + esc(msg || '') + '</p><button class="btn primary">Log in</button>'
      + '<p class="muted">First time here, or forgot your password? <button type="button" class="link" id="to-setup">Set up your login</button></p></form>';
    logos();
  }
  function showSetup(email) {
    document.getElementById('top').hidden = true;
    app.innerHTML = '<form class="card auth" id="setup"><img data-logo alt="The Business Funders"><h1>Create your account</h1><p class="muted">Use the email you gave us. We will send a code to prove it is you.</p>'
      + '<div class="field"><label for="e">Email</label><input id="e" name="email" type="email" autocomplete="username" required value="' + esc(email || '') + '"></div>'
      + '<p class="err" id="msg" hidden></p><button class="btn primary">Send my code</button><p class="muted">Already have a login? <button type="button" class="link" id="to-login">Log in</button></p></form>';
    logos();
  }
  function showCode(email) {
    app.innerHTML = '<form class="card auth" id="code" data-email="' + esc(email) + '"><img data-logo alt="The Business Funders"><h1>Check your email</h1><p class="muted">If ' + esc(email) + ' is on file with us, a 6-digit code is on its way. It lasts 15 minutes. Nothing after a few minutes? Check spam or text ' + PHONE + '.</p>'
      + '<div class="field"><label for="c">6-digit code</label><input id="c" name="code" inputmode="numeric" autocomplete="one-time-code" required maxlength="6"></div>'
      + '<div class="field"><label for="p">Choose a password (at least 10 characters)</label><input id="p" name="password" type="password" autocomplete="new-password" required minlength="10"></div>'
      + '<p class="err" id="msg" hidden></p><button class="btn primary">Open my portal</button><p class="muted"><button type="button" class="link" id="to-setup">Start over</button></p></form>';
    logos();
  }
  function err(m) { var e = document.getElementById('msg'); if (e) { e.textContent = m; e.hidden = false; } }

  function bureauLine(a) { return a.pull_type === 'soft' ? 'No credit inquiry' : (a.bureaus || []).map(function (b) { return BUREAU[b] || b; }).join(', '); }
  function pill(a) {
    if (a.status === 'denied') return '<span class="pill bad">Denied</span>';
    if (a.status === 'submitted') return '<span class="pill">Pending</span>';
    if (a.decision === 'accepted') return '<span class="pill good">You accepted</span>';
    if (a.decision === 'rejected') return '<span class="pill mute">You passed</span>';
    return '<span class="pill warn">Needs your decision</span>';
  }
  function fmt(d) { return new Date(d).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }); }
  /* Plain words for the client, not our internal pipeline stages. */
  var STEPS = ['Getting started', 'Preparing your file', 'Applying to lenders', 'Your offers', 'Final paperwork', 'Funded'], APPLY_URL = 'https://api.leadconnectorhq.com/widget/form/Yb7joyKV2cUN5YTJIcCj';
  /* Progress follows what has actually happened, not the internal pipeline stage. */
  function stepNow(d, offers) {
    if (d.stage === 10) return 5;
    if (offers.length) return 3;
    if (!d.apps.length) return d.application_received ? 1 : 0;
    var lastR = Math.max.apply(null, d.apps.map(function (a) { return a.round; })), latest = d.apps.filter(function (a) { return a.round === lastR; });
    if (latest.some(function (a) { return a.status === 'submitted'; })) return 2;
    return latest.some(function (a) { return a.status === 'approved' && a.decision === 'accepted'; }) ? 4 : 2;
  }
  function stepper(d, offers) {
    var cur = stepNow(d, offers), all = d.stage === 10;
    return '<ol class="steps">' + STEPS.map(function (s, i) { return '<li class="' + (i < cur || all ? 'done' : i === cur ? 'now' : '') + '"' + (i === cur ? ' aria-current="step"' : '') + '><i aria-hidden="true">' + (i < cur || all ? '✓' : i + 1) + '</i><span>' + s + '</span></li>'; }).join('') + '</ol>';
  }
  function nextStep(d, F, offers) {
    var due = F.rounds.filter(function (r) { return r.fee > 0 && !r.paid; })[0];
    if (offers.length) return ['Your turn', 'Review ' + (offers.length === 1 ? 'your new offer' : 'your ' + offers.length + ' new offers'), 'Choose accept or no thanks below. Nothing is final until you decide.', 'warn'];
    if (due) return ['Your turn', 'Pay your ' + money(due.fee) + ' round ' + due.round + ' fee', 'Due when your card arrives or your loan is deposited' + (due.dueBy ? ', and no later than ' + fmt(due.dueBy) : '') + '. Pay by your payment link, Zelle, Cash App or Venmo. Round ' + (due.round + 1) + ' begins once we receive it.', 'warn'];
    if (d.stage !== 0 && d.stage !== 10 && !d.application_received && !d.apps.length) return ['Your turn', 'Complete your Business Funding Application', 'We need it to prepare your file. It asks for your voided check, so use the account where you want your funds deposited.', 'warn', APPLY_URL];
    if (d.stage === 0) return ['Update', 'This file is closed', 'Questions? Text us at ' + PHONE + '.', ''];
    if (d.stage === 10) return ['All set', 'You are funded', 'Thank you for working with us. Text ' + PHONE + ' anytime.', 'good'];
    return ['Our turn', 'We are working on your file', 'Nothing is needed from you right now. We will email you when an offer comes in.', ''];
  }
  function dealHtml(d) {
    var F = fundingSummary(d.apps, d.payments, d.fee_pct), offers = d.apps.filter(function (a) { return a.status === 'approved' && !a.decision; }), N = nextStep(d, F, offers), lastR = F.rounds.length ? F.rounds[F.rounds.length - 1].round : 0;
    return '<section class="hero"><div><small>' + esc(d.company || 'Your funding') + '</small><div class="big">' + money(F.accepted) + '</div><small>Your total approved funding</small><small>Every approval counts until you pass on it.</small></div></section>'
      + '<section class="card next ' + N[3] + '"><span class="eyebrow">' + N[0] + '</span><h2>' + esc(N[1]) + '</h2><p>' + esc(N[2]) + '</p>' + (N[4] ? '<a class="btn primary" style="align-self:flex-start" href="' + N[4] + '" target="_blank" rel="noopener">Complete my application</a>' : '') + (d.note ? '<p class="team-note"><b>From your team:</b> ' + esc(d.note) + '</p>' : '') + '</section>'
      + (offers.length ? '<section class="stack"><h2 class="sect">Offers for you</h2>' + offers.map(function (a) {
        return '<div class="offer"><div class="head"><b>' + esc(a.lender) + (a.product ? ' · ' + esc(a.product) : '') + '</b><span class="pill">Round ' + a.round + '</span></div><div class="amt">' + money(a.approved_amt) + '</div>' + (a.charge_card ? '<p class="muted">Charge card. Each charge card counts as ' + money(CHARGE_CARD_AMT) + ' toward your funding.</p>' : '') + '<div class="terms"><span class="terms-label">Terms</span>' + (a.terms ? '<p>' + esc(a.terms) + '</p>' : '<p class="muted">We are adding the terms for this offer. You can accept it once they are here. Questions? Text ' + PHONE + '.</p>') + '</div>'
          + '<div class="acts">' + (a.terms ? '<button class="btn primary" data-decide="accepted" data-id="' + a.id + '" data-amt="' + money(a.approved_amt) + '">Accept this offer</button>' : '') + '<button class="btn" data-decide="rejected" data-id="' + a.id + '" data-amt="' + money(a.approved_amt) + '">No thanks</button></div></div>';
      }).join('') + '</section>' : '')
      + '<section class="card"><h2>Message your team</h2><p class="muted">Ask us anything about your funding. We will reply by text or email.</p><form id="msg-form" data-deal="' + d.id + '"><div class="field"><label for="msg-text">Your message</label><textarea id="msg-text" name="text" rows="3" maxlength="2000" required></textarea></div><p class="err" id="msg-err" hidden></p><button class="btn primary" style="align-self:flex-start">Send message</button></form>' + ((d.messages || []).length ? '<div class="sent"><h3 class="grp">Sent</h3>' + d.messages.map(function (m) { return '<div class="row"><div>' + esc(m.body) + '<small>' + fmt(m.at) + '</small></div></div>'; }).join('') + '</div>' : '') + '</section>'
      + '<section class="card"><h2>Your progress</h2>' + (d.stage === 0 ? '<span class="pill bad" style="align-self:flex-start">File closed</span>' : stepper(d, offers)) + '</section>'
      + (F.rounds.length ? '<section class="stack"><h2 class="sect">Where we applied</h2>' + F.rounds.map(function (r) {
        return '<details class="round"' + (r.round === lastR ? ' open' : '') + '><summary><b>Round ' + r.round + '</b><span>' + money(r.accepted) + ' approved' + (r.pending ? ' · ' + r.pending + ' pending' : '') + '</span></summary>' + appGroups(r.apps).map(function (g) { return '<h3 class="grp">' + g.label + ' <span>(' + g.apps.length + ')</span></h3>' + g.apps.map(function (a) {
          return '<div class="row"><div><b>' + esc(a.lender) + '</b><small>' + (a.charge_card ? 'Charge card · ' : '') + esc(a.product || '') + (a.product ? ' · ' : '') + esc(bureauLine(a)) + '</small>' + (a.status === 'approved' && a.terms ? '<details class="view-terms"><summary>View terms</summary><p>' + esc(a.terms) + '</p></details>' : '') + '</div><div class="right">' + (a.status === 'approved' ? '<b>' + money(a.approved_amt) + '</b>' : '') + pill(a) + '</div></div>';
        }).join(''); }).join('') + (r.fee > 0 ? '<div class="fee"><span>Fee for this round (' + F.pct + '%): <b>' + money(r.fee) + '</b></span>' + (r.paid ? '<span class="pill good">Paid</span>' : '<span class="pill warn">Due</span>') + '</div>' : '') + '</details>';
      }).join('') + '</section><section class="card"><h2>Credit inquiries</h2><p class="muted">One for each hard pull, approved or denied.</p><div class="tiles">' + ['EX', 'EQ', 'TU'].map(function (b) { return '<div class="tile"><span>' + BUREAU[b] + '</span><b>' + F.inquiries[b] + '</b></div>'; }).join('') + '</div></section>' : '');
  }
  function load() {
    return sb.rpc('client_portal').then(function (r) {
      if (r.error) throw r.error;
      var data = r.data || [], s = JSON.stringify(data);
      if (s === last) return; last = s;
      if (!data.length) return sb.auth.getUser().then(function (u) { return sb.from('partners').select('id').eq('id', u.data.user.id).maybeSingle(); }).then(function (m) { if (m.data) location.replace('index.html'); else show(data); });
      show(data);
    });
  }
  function show(data) {
    {
      document.getElementById('top').hidden = false;
      var name = data[0] && data[0].first ? ', ' + esc(data[0].first) : '';
      app.innerHTML = '<div><h1>Hi' + name + '</h1></div>' + (data.length ? data.map(dealHtml).join('') : '<section class="card"><h2>No funding file found</h2><p>We could not find a file under this login. Please text ' + PHONE + ' and we will sort it out.</p></section>')
        + '<p class="muted">Questions? Text ' + PHONE + ' or email partnership@thebusinessfunders.com, Monday to Friday, 10am to 5pm EST.</p>';
      logos();
    }
  }
  function enter() { return load().catch(function () { showLogin('We could not load your file. Please try again.'); }); }

  document.addEventListener('submit', function (e) {
    e.preventDefault();
    var f = e.target, btn = f.querySelector('button.primary'); if (btn) btn.disabled = true;
    function back() { if (btn) btn.disabled = false; }
    if (f.id === 'login') sb.auth.signInWithPassword({ email: f.email.value.trim().toLowerCase(), password: f.password.value }).then(function (r) { if (r.error) { back(); err('That email and password did not match. First time here? Set up your login below.'); } else enter(); });
    else if (f.id === 'msg-form') { var box = f.text, me = document.getElementById('msg-err'); me.hidden = true; sb.rpc('client_send_message', { p_deal: +f.getAttribute('data-deal'), p_text: box.value }).then(function (r) { back(); if (r.error) { me.textContent = /too many/.test(r.error.message) ? 'You have sent a lot of messages this hour. Please text ' + PHONE + '.' : 'That did not send. Please try again or text ' + PHONE + '.'; me.hidden = false; return; } last = ''; return load(); }); }
    else if (f.id === 'setup') { var em = f.email.value.trim().toLowerCase(); clientApi({ action: 'start', email: em }).then(function (j) { if (j.needs_agreement) { back(); err('Please sign your funding agreement first. Your link is in your email, or text ' + PHONE + '.'); } else showCode(em); }).catch(function (x) { back(); err(x.message); }); }
    else if (f.id === 'code') { var email = f.getAttribute('data-email'), pw = f.password.value; clientApi({ action: 'verify', email: email, code: f.code.value.trim(), password: pw }).then(function () { return sb.auth.signInWithPassword({ email: email, password: pw }); }).then(function (r) { if (r.error) throw r.error; return enter(); }).catch(function (x) { back(); err(x.message); }); }
  });
  document.addEventListener('click', function (e) {
    var t = e.target;
    if (t.id === 'to-setup') { var cur = document.getElementById('e'); showSetup(cur ? cur.value : ''); }
    else if (t.id === 'to-login') showLogin();
    else if (t.id === 'logout') sb.auth.signOut().then(function () { showLogin(); });
    else if (t.getAttribute && t.getAttribute('data-decide')) {
      var dec = t.getAttribute('data-decide'), amt = t.getAttribute('data-amt');
      if (!window.confirm(dec === 'accepted' ? 'Accept this ' + amt + ' offer on the terms shown? It stays in your total, and our fee applies to it.' : 'Pass on this ' + amt + ' offer? It will be removed from your total, and no fee applies to it.')) return;
      t.disabled = true;
      sb.auth.getSession().then(function (r) { return clientApi({ action: 'decide', id: +t.getAttribute('data-id'), decision: dec }, r.data.session.access_token); }).then(function () { last = ''; return load(); }).catch(function (x) { t.disabled = false; window.alert(x.message); });
    }
  });
  setInterval(function () { if (!document.hidden && !document.getElementById('login') && !document.getElementById('setup') && !document.getElementById('code')) sb.auth.getSession().then(function (r) { if (r.data.session) load().catch(function () {}); }); }, 30000);
  sb.auth.getSession().then(function (r) { if (r.data.session) return enter(); if (location.hash === '#setup') showSetup(); else showLogin(); }).catch(function () { showLogin(); });
})();
</script>
